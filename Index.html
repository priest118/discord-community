
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome to Our Community</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(31, 41, 55, 0.96);
      padding: 40px 28px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.35);
    }

    .logo {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .join-button {
      display: inline-block;
      background: #5865F2;
      color: white;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .join-button:hover {
      background: #4752c4;
      transform: translateY(-3px);
    }

    .notice {
      font-size: 12px;
      margin-top: 25px;
      color: #9ca3af;
    }

    footer {
      margin-top: 25px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">💬</div>

    <h1>Welcome to Our Community</h1>

    <p>
      Connect with our community, meet new people,
      exchange ideas and receive support.
      We're glad to have you here!
    </p>

    <a
      class="join-button"
      href="https://discord.gg/Urce3VbbRR"
      target="_blank"
      rel="noopener noreferrer">
      Join Our Discord Community
    </a>

    <div class="notice">
      You will be redirected to Discord when you click Join.
    </div>

    <footer>
      © 2026 Our Community. All rights reserved.
    </footer>

  </div>

</body>
</html>
